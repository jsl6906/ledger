[project]
name = "ledger"
version = "0.1.0"
description = "Ledger - household personal finances app"
authors = [
    { name = "Joshuah Latimore", email = "jsl6906@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "azure-identity>=1.25.3",
    "cryptography>=50.0.1",
    "duckdb>=1.5.6",
    "fastapi>=0.141.1",
    "google-auth[requests]>=2.59.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "sqlglot>=30.20.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py313"
extend-exclude = ["src/ledger/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "ASYNC240"]
